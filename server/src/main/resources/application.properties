spring.application.name=aprimorar-api
spring.profiles.default=dev

spring.jackson.time-zone=UTC
spring.docker.compose.enabled=false
spring.main.lazy-initialization=false
spring.config.import=optional:file:./.env[.properties]

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

financeiro.jobs.status-cron=0 0 2 * * *

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

springdoc.api-docs.path=/v3/api-docs
springdoc.api-docs.version=openapi_3_0
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.override-with-generic-response=false

app.auth.issuer=aprimorar-api
app.auth.access-token-minutes=5
app.auth.refresh-token-days=30
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:false}
app.auth.frontend-origin=${FRONTEND_URL}
security.jwt.secret=${JWT_SECRET}

aprimorar.admin-username=${APP_ADMIN_USERNAME:admin@aprimorar.com}
aprimorar.admin-password=${APP_ADMIN_PASSWORD:}
